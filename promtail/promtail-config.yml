# Promtail Configuration
# Gas Automation System - Log Shipping to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Backend logs
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          service: gas-automation-backend
          __path__: /var/log/backend/*.log
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            message_id: message_id
            trace_id: trace_id
            phone: phone
            module: name
      - labels:
          level:
          message_id:
          trace_id:
          phone:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339

  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    
    relabel_configs:
      # Apenas containers do projeto
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: gas-automation
        action: keep
      
      # Labels úteis
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      - json:
          expressions:
            tag: attrs.tag
            message_id: attrs.message_id
            trace_id: attrs.trace_id
          source: attrs
      - labels:
          stream:
          tag:
          message_id:
          trace_id:
      - output:
          source: output

  # System logs (opcional)
  - job_name: syslog
    syslog:
      listen_address: 0.0.0.0:1514
      labels:
        job: syslog
        service: system
    
    relabel_configs:
      - source_labels: [__syslog_message_hostname]
        target_label: hostname
      - source_labels: [__syslog_message_severity]
        target_label: severity
      - source_labels: [__syslog_message_app_name]
        target_label: app
