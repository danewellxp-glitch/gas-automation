[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "alembic/versions",
    "exports",
    "static",
    "scripts",
    "query",
    "tests/test_load.py",
]

[tool.ruff.lint]
# Cycle 1 baseline: catch correctness/syntax issues only.
# Style and complexity rules will be ratcheted up in later cycles.
select = [
    "E9",   # syntax errors
    "F63",  # invalid comparisons
    "F7",   # syntax errors in type annotations / keyword usage
    "F82",  # undefined name in __all__
    "F821", # undefined name
    "F823", # local variable referenced before assignment
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
# Advisory-only in Cycle 1 (continue-on-error in CI).
# Tighten progressively per Architecture Health Report roadmap.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
strict_optional = true
exclude = [
    "alembic/versions/",
    "exports/",
    "scripts/",
    "tests/",
    "static/",
    "query/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
