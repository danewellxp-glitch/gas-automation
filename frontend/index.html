<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logogas01.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GasMaster — Painel</title>
    <!-- Inter font (Preline default) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Theme detection (avoid flash) -->
    <script>
      (function () {
        const stored = localStorage.getItem('hs_theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const dark = stored === 'dark' || (stored === 'auto' && prefersDark) || (!stored && prefersDark)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
