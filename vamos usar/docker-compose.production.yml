# =============================================
# DOCKER COMPOSE - GAS AUTOMATION
# Servidor: 192.168.10.156
# Ambiente: PRODUÇÃO
# =============================================

version: '3.8'

services:
  # ============= BANCO DE DADOS =============
  postgres:
    image: postgres:15-alpine
    container_name: gas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-gas_automation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gas_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= CACHE =============
  redis:
    image: redis:7-alpine
    container_name: gas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= STORAGE =============
  minio:
    image: minio/minio:latest
    container_name: gas_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - gas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= API BACKEND =============
  backend:
    build:
      context: .
      dockerfile: vamos usar/Dockerfile
    container_name: gas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:-gas_user}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-gas_automation}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - API_BASE_URL=http://192.168.10.156:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - gas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============= FRONTEND =============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gas_frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://192.168.10.156:8000/api
      - VITE_WS_URL=ws://192.168.10.156:8000/ws
    depends_on:
      - backend
    networks:
      - gas_network

  # ============= MONITORAMENTO - PROMETHEUS =============
  prometheus:
    image: prom/prometheus:latest
    container_name: gas_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - gas_network

  # ============= VISUALIZAÇÃO - GRAFANA =============
  grafana:
    image: grafana/grafana:latest
    container_name: gas_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - gas_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  gas_network:
    driver: bridge
